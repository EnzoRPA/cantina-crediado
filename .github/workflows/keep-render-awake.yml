name: Keep Render Awake

on:
  schedule:
    # Executa a cada 10 minutos (Render dorme com 15 min de inatividade)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Up Render
        run: |
          curl -s -f "https://cantina-escolar.onrender.com/api/health" || curl -s -f "https://cantina-escolar.onrender.com/health" || echo "Ping enviado"
